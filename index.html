<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Puzzle Game</title>
<style>
  :root{
    --bg:#f2f1ec;
    --surface:#ffffff;
    --surface-2:#e9e7df;
    --ink:#1d1a15;
    --muted:#6f6a5e;
    --line:#d9d5c9;
    --accent:#0f766e;
    --accent-ink:#ffffff;
    --gold:#b45309;
    --felt:#33523f;
    --felt-deep:#27402f;
    --shadow:0 8px 24px rgba(29,26,21,.14);
    --shadow-sm:0 2px 8px rgba(29,26,21,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181a;
      --surface:#222527;
      --surface-2:#2b2f31;
      --ink:#f0eee8;
      --muted:#a3a099;
      --line:#3a3e40;
      --accent:#2dd4bf;
      --accent-ink:#0b2422;
      --gold:#f0b45a;
      --felt:#2c4a38;
      --felt-deep:#203829;
      --shadow:0 8px 24px rgba(0,0,0,.5);
      --shadow-sm:0 2px 8px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100vh;-webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:14px 16px 36px;display:flex;flex-direction:column}
  .bar{order:0}
  .picker{order:1}
  .stage{order:2}
  /* phones: the game comes first, the picture shelf after it */
  @media (max-width:860px){
    .stage{order:1}
    .picker{order:2;margin-top:14px}
  }

  .page-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .page-head h1{font-size:20px;margin:0}
  .page-head span{font-size:14px;color:var(--muted);font-weight:600}
  .search-row{display:flex;gap:10px;margin-bottom:10px}
  .search-row input{flex:1;max-width:320px;font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
  #picError{display:none;font-size:13.5px;color:var(--gold);font-weight:700;margin:0 0 10px}
  /* ---------- toolbar ---------- */
  .bar{
    display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .bar-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .stats{display:flex;gap:16px;align-items:baseline;font-variant-numeric:tabular-nums}
  .stat{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
  .stat b{font-size:17px;color:var(--ink);font-weight:800;margin-left:4px}
  .btn{
    appearance:none;font:inherit;font-size:14px;font-weight:700;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:9px;padding:8px 14px;box-shadow:var(--shadow-sm);
    display:inline-flex;align-items:center;gap:6px;touch-action:manipulation;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
  .seg button{
    appearance:none;border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;
    color:var(--muted);padding:6px 13px;border-radius:99px;cursor:pointer;font-variant-numeric:tabular-nums;
    touch-action:manipulation;
  }
  .seg button.sel{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
  .seg-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* ---------- picture picker ---------- */
  .picker{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .pick{
    appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;
    padding:4px;cursor:pointer;width:92px;flex:none;font:inherit;color:inherit;text-align:left;
  }
  .pick img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;display:block;background:var(--felt)}
  .pick span{display:block;font-size:11.5px;font-weight:700;margin:4px 2px 2px;line-height:1.25}
  .pick.sel{border-color:var(--accent)}
  .pick.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-style:dashed;color:var(--muted);min-height:76px}
  .pick.upload span{margin:0;font-size:12px}
  .pick.upload svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- stage ---------- */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:14px;align-items:start}
  @media (max-width:860px){
    .stage{grid-template-columns:minmax(0,1fr)}
  }
  .board-frame{
    background:linear-gradient(160deg,var(--felt),var(--felt-deep));
    border-radius:14px;padding:10px;box-shadow:var(--shadow);
  }
  #board{position:relative;width:100%;border-radius:6px;overflow:hidden;touch-action:none;background:rgba(0,0,0,.18)}
  #ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.16;pointer-events:none;display:none}
  #board.ghost-on #ghost{display:block}
  #grid{position:absolute;inset:0;pointer-events:none;display:none}
  #board.ghost-on #grid{display:block}
  #placedLayer,#looseLayer{position:absolute;inset:0}
  #placedLayer{pointer-events:none}
  #flash{
    position:absolute;display:none;pointer-events:none;border-radius:4px;z-index:5;
    box-shadow:inset 0 0 0 3px var(--gold);
  }
  #flash.on{display:block;animation:flashPulse .5s ease-in-out 3}
  @keyframes flashPulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ #flash.on{animation:none} }
  #peek{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:40;pointer-events:none}
  #board.peeking #peek{display:block}
  #winBar{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;
    display:none;align-items:center;gap:12px;max-width:92%;
    background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 10px 9px 18px;
    box-shadow:var(--shadow);font-size:15px;font-weight:700;white-space:nowrap;
  }
  #winBar.on{display:inline-flex}
  #winBar .btn{padding:7px 13px}

  /* ---------- pieces ---------- */
  .piece{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .piece canvas{display:block;filter:drop-shadow(0 2px 3px rgba(10,10,5,.45))}
  .piece.locked{cursor:default}
  .piece.locked canvas{filter:none}
  .piece.dragging{cursor:grabbing;z-index:60 !important}
  .piece.dragging canvas{filter:drop-shadow(0 10px 14px rgba(10,10,5,.5))}
  .piece.selected canvas{filter:drop-shadow(0 0 0 var(--accent)) drop-shadow(0 0 9px var(--accent))}
  .piece.hintpulse canvas{animation:hintPulse .45s ease-in-out 3}
  @keyframes hintPulse{0%,100%{filter:drop-shadow(0 2px 3px rgba(10,10,5,.45))}50%{filter:drop-shadow(0 0 12px var(--gold)) brightness(1.25)}}
  @media (prefers-reduced-motion: reduce){ .piece.hintpulse canvas{animation:none} }

  /* ---------- tray ---------- */
  .tray-panel{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:10px;box-shadow:var(--shadow-sm);
  }
  .tray-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .tray-head h2{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0}
  .tray-head span{font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  #tray{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    max-height:520px;overflow-y:auto;overscroll-behavior:contain;padding:2px;
  }
  @media (max-width:860px){
    #tray{grid-template-columns:repeat(4,1fr);max-height:300px}
  }
  @media (max-width:420px){
    #tray{grid-template-columns:repeat(3,1fr)}
  }
  #tray .piece{position:relative;left:auto !important;top:auto !important;width:100% !important;height:auto !important}
  #tray .piece canvas{width:100%;height:auto}
  #board .piece canvas{width:100%;height:auto}
  #trayEmpty{display:none;font-size:13.5px;color:var(--muted);padding:10px 2px;line-height:1.45}
  #trayEmpty.on{display:block}
  .hint-line{font-size:13px;color:var(--muted);margin:10px 2px 0;line-height:1.45}
</style>

<body>
<div class="wrap">

  <header class="page-head"><h1>Puzzle</h1><span id="picName">Mountain Lake</span></header>

  <div class="bar">
    <div class="bar-group">
      <button class="btn primary" id="newBtn" type="button">New game</button>
      <button class="btn" id="undoBtn" type="button" disabled>Undo</button>
      <button class="btn" id="ghostBtn" type="button" aria-pressed="true">Guide</button>
      <button class="btn" id="peekBtn" type="button">Hold to peek</button>
      <button class="btn" id="hintBtn" type="button">Hint</button>
    </div>
    <div class="bar-group">
      <span class="seg-label" id="sizeLabel">Pieces</span>
      <div class="seg" role="group" aria-labelledby="sizeLabel" id="sizeSeg">
        <button type="button" data-n="12">12</button>
        <button type="button" data-n="24" class="sel">24</button>
        <button type="button" data-n="48">48</button>
        <button type="button" data-n="96">96</button>
        <button type="button" data-n="192">192</button>
      </div>
    </div>
    <div class="stats" aria-live="off">
      <span class="stat">Placed<b id="statPlaced">0 / 24</b></span>
      <span class="stat">Time<b id="statTime">0:00</b></span>
      <span class="stat">Moves<b id="statMoves">0</b></span>
    </div>
  </div>

  <div class="search-row"><input id="picSearch" type="search" placeholder="Search pictures" aria-label="Search pictures" /><p id="picError"></p></div>
  <div class="picker" id="picker" role="group" aria-label="Choose a picture"></div>

  <div class="stage">
    <div class="board-frame">
      <div id="board" class="ghost-on">
        <img id="ghost" alt="" draggable="false" />
        <canvas id="grid"></canvas>
        <div id="placedLayer"></div>
        <div id="looseLayer"></div>
        <div id="flash"></div>
        <img id="peek" alt="" draggable="false" />
        <div id="winBar"><span id="winText">Solved</span><button class="btn primary" id="againBtn" type="button">Play again</button></div>
      </div>
    </div>

    <div class="tray-panel">
      <div class="tray-head"><h2>Piece tray</h2><span id="trayCount"></span></div>
      <div id="tray"></div>
      <p id="trayEmpty">Tray empty. Pieces left are on the board.</p>
      <p class="hint-line">Drag pieces onto the board. A piece near its spot snaps in. Tap a piece, then tap the board, works too.</p>
    </div>
  </div>

</div>

<input type="file" id="fileInput" accept="image/*" hidden />

  function loadPicture(url, name, btn){
    picError.style.display = "none";

      if(seq !== loadSeq) return;

  /* ---------------- grid sizing ---------------- */
  function gridFor(n, aspect){
    var r = Math.max(2, Math.round(Math.sqrt(n / aspect)));
    var c = Math.max(2, Math.round(n / r));
    return { cols:c, rows:r };
  }

  /* ---------------- piece shape ---------------- */
  // Path is drawn in a coordinate space where the piece body is
  // (0,0)-(cw,ch) and the canvas extends a margin on every side for
  // the tabs; the context is pre-translated by that margin.
  function piecePath(ctx, cw, ch, e){
    ctx.beginPath();
    ctx.moveTo(0, 0);
    drawEdgeAbs(ctx, 0, 0, 1, 0, 0, -1, cw, e.t);
    drawEdgeAbs(ctx, cw, 0, 0, 1, 1, 0, ch, e.r);
    drawEdgeAbs(ctx, cw, ch, -1, 0, 0, 1, cw, e.b);
    drawEdgeAbs(ctx, 0, ch, 0, -1, -1, 0, ch, e.l);
    ctx.closePath();
  }
  // drawEdge works relative to current point via lineTo with absolute
  // coordinates computed from a start point.
  function drawEdgeAbs(ctx, sx, sy, dx, dy, nx, ny, len, tab){
    if(!tab){ ctx.lineTo(sx + dx * len, sy + dy * len); return; }
    var b = tab * 0.21 * len;
    function P(f, o){ return [sx + dx * len * f + nx * o, sy + dy * len * f + ny * o]; }
    var p;
    p = P(0.34, 0);  ctx.lineTo(p[0], p[1]);
    p = P(0.5, b);   ctx.bezierCurveTo(P(0.40,0)[0], P(0.40,0)[1], P(0.38,b)[0], P(0.38,b)[1], p[0], p[1]);
    p = P(0.66, 0);  ctx.bezierCurveTo(P(0.62,b)[0], P(0.62,b)[1], P(0.60,0)[0], P(0.60,0)[1], p[0], p[1]);
    p = P(1, 0);     ctx.lineTo(p[0], p[1]);
  }

  /* ---------------- layout ---------------- */
  function boardW(){ return board.clientWidth; }
  function boardH(){ return board.clientHeight; }
  function cellW(){ return boardW() / cols; }
  function cellH(){ return boardH() / rows; }
  function margin(){ return Math.min(cellW(), cellH()) * 0.26; }

  function renderPiece(p){
    var bw = boardW(), bh = boardH();
    if(!bw) return;
    var cw = cellW(), ch = cellH(), m = margin();
    var srcCW = img.naturalWidth / cols, srcCH = img.naturalHeight / rows;
    var srcM = m * (img.naturalWidth / bw); // margin in source px (x); y is proportional
    var srcMy = m * (img.naturalHeight / bh);
    var cv = p.canvas, ctx = cv.getContext("2d");
    cv.width  = Math.round(srcCW + 2 * srcM);
    cv.height = Math.round(srcCH + 2 * srcMy);
    // path space: scale source px -> body (0,0)-(srcCW,srcCH), translated by margin
    ctx.setTransform(1, 0, 0, 1, srcM, srcMy);
    piecePath(ctx, srcCW, srcCH, p.edges, 0);
    ctx.clip();
    ctx.drawImage(img, -(p.c * srcCW - srcM), -(p.r * srcCH - srcMy));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // subtle edge so pieces read against the felt and each other
    ctx.setTransform(1, 0, 0, 1, srcM, srcMy);
    piecePath(ctx, srcCW, srcCH, p.edges, 0);
    ctx.strokeStyle = "rgba(15,12,8,.55)";
    ctx.lineWidth = Math.max(1.2, srcCW * 0.012);
    ctx.stroke();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // CSS size at board scale
    p.el.style.width  = (cw + 2 * m) + "px";
    p.el.style.height = (ch + 2 * m) + "px";
  }

  function positionPiece(p){
    var cw = cellW(), ch = cellH(), m = margin();
    if(p.state === "locked"){
      p.el.style.left = (p.c * cw - m) + "px";
      p.el.style.top  = (p.r * ch - m) + "px";
    } else if(p.state === "loose"){
      p.el.style.left = (p.lx * boardW() - m) + "px";
      p.el.style.top  = (p.ly * boardH() - m) + "px";
    }
  }

  function drawGrid(){
    var bw = boardW(), bh = boardH();
    if(!bw) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    gridCv.width = bw * dpr; gridCv.height = bh * dpr;
    gridCv.style.width = bw + "px"; gridCv.style.height = bh + "px";
    var ctx = gridCv.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(var c = 1; c < cols; c++){ ctx.moveTo(c * cellW(), 0); ctx.lineTo(c * cellW(), bh); }
    for(var r = 1; r < rows; r++){ ctx.moveTo(0, r * cellH()); ctx.lineTo(bw, r * cellH()); }
    ctx.stroke();
  }

  function layoutAll(){
    drawGrid();
    pieces.forEach(function(p){
      renderPiece(p);
      if(p.state !== "tray") positionPiece(p);
    });
  }

  /* ---------------- game setup ---------------- */
  function newGame(){
    if(!img.naturalWidth) return;
    stopTimer();
    placed = 0; moves = 0; elapsed = 0; running = false; solved = false; selected = null; undoStack.length = 0;
    winBar.classList.remove("on");
    board.classList.remove("peeking");

    var aspect = img.naturalWidth / img.naturalHeight;
    board.style.aspectRatio = img.naturalWidth + " / " + img.naturalHeight;
    var g = gridFor(targetN, aspect);
    cols = g.cols; rows = g.rows; total = cols * rows;

    ghostImg.src = imgURL; peekImg.src = imgURL;

    // shared edges: hEdge[r][c] = right edge of (r,c); vEdge[r][c] = bottom edge of (r,c)
    var hEdge = [], vEdge = [], r, c;
    for(r = 0; r < rows; r++){ hEdge.push([]); vEdge.push([]);
      for(c = 0; c < cols; c++){
        hEdge[r].push(Math.random() < 0.5 ? 1 : -1);
        vEdge[r].push(Math.random() < 0.5 ? 1 : -1);
      }
    }

    placedLayer.innerHTML = ""; looseLayer.innerHTML = ""; tray.innerHTML = "";
    pieces = [];
    for(r = 0; r < rows; r++){
      for(c = 0; c < cols; c++){
        var edges = {
          t: r === 0 ? 0 : -vEdge[r - 1][c],
          b: r === rows - 1 ? 0 : vEdge[r][c],
          l: c === 0 ? 0 : -hEdge[r][c - 1],
          r: c === cols - 1 ? 0 : hEdge[r][c]
        };
        var el = document.createElement("div");
        el.className = "piece"; el.style.zIndex = 10;
        var cv = document.createElement("canvas");
        el.appendChild(cv);
        var p = { r:r, c:c, edges:edges, el:el, canvas:cv, state:"tray", lx:0, ly:0 };
        el._piece = p;
        pieces.push(p);
        attachDrag(p);
      }
    }
    // shuffle into the tray
    var order = pieces.slice();
    for(var i = order.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    order.forEach(function(p){ tray.appendChild(p.el); });

    updateStats();
    requestAnimationFrame(layoutAll);
  }

  /* ---------------- stats / timer ---------------- */
  function fmt(s){
    var m = Math.floor(s / 60), ss = s % 60;
    return m + ":" + (ss < 10 ? "0" : "") + ss;
  }
  function updateStats(){
    statPlaced.textContent = placed + " / " + total;
    statMoves.textContent = moves;
    statTime.textContent = fmt(elapsed);
    var inTray = pieces.filter(function(p){ return p.state === "tray"; }).length;
    trayCount.textContent = inTray ? inTray + " left" : "";
    trayEmpty.classList.toggle("on", inTray === 0);
    undoBtn.disabled = undoStack.length === 0;
  }
  function startTimer(){
    if(running || solved) return;
    running = true;
    startedAt = Date.now() - elapsed * 1000;
    timerId = setInterval(function(){
      elapsed = Math.floor((Date.now() - startedAt) / 1000);
      statTime.textContent = fmt(elapsed);
    }, 500);
  }
  function stopTimer(){
    running = false;
    if(timerId){ clearInterval(timerId); timerId = 0; }
  }

  /* ---------------- undo: a piece can never be lost by a bad drop ---------------- */
  function pushUndo(p){
    undoStack.push({ p:p, state:p.state, lx:p.lx, ly:p.ly, placed:placed, moves:moves, solved:solved });
    if(undoStack.length > 50) undoStack.shift();
  }
  function undoLast(){
    var u = undoStack.pop(); if(!u) return;
    var p = u.p;
    p.state = u.state; p.lx = u.lx; p.ly = u.ly;
    p.el.classList.remove("locked");
    if(u.state === "tray"){ tray.appendChild(p.el); }
    else if(u.state === "loose"){ looseLayer.appendChild(p.el); positionPiece(p); }
    else { placedLayer.appendChild(p.el); p.el.classList.add("locked"); positionPiece(p); }
    placed = u.placed; moves = u.moves; solved = u.solved;
    if(!solved) winBar.classList.remove("on");
    deselect(); updateStats();
  }
  undoBtn.addEventListener("click", undoLast);

  /* ---------------- placement ---------------- */
  function homeXY(p){ return { x: p.c / cols, y: p.r / rows }; }

  function lockPiece(p){
    pushUndo(p);
    p.state = "locked";
    p.el.classList.add("locked");
    p.el.style.zIndex = 1;
    placedLayer.appendChild(p.el);
    deselect();
    positionPiece(p);
    placed++;
    moves++;
    updateStats();
    if(placed === total) onSolved();
  }

  function placeLoose(p, fx, fy){
    pushUndo(p);
    // fx, fy: desired cell-origin position as board fractions
    var cw = 1 / cols, ch = 1 / rows;
    fx = Math.max(0, Math.min(1 - cw, fx));
    fy = Math.max(0, Math.min(1 - ch, fy));
    p.lx = fx; p.ly = fy;
    p.state = "loose";
    renderPiece(p);
    p.el.style.zIndex = 10 + Math.floor(Math.random() * 5);
    looseLayer.appendChild(p.el);
    positionPiece(p);
    moves++;
    updateStats();
  }

  function sendToTray(p){
    pushUndo(p);
    p.state = "tray";
    renderPiece(p);
    tray.appendChild(p.el);
    moves++;
    updateStats();
  }

  function trySnap(p, fx, fy){
    var h = homeXY(p);
    var dx = Math.abs(fx - h.x) * boardW();
    var dy = Math.abs(fy - h.y) * boardH();
    var tol = Math.min(cellW(), cellH()) * 0.45;
    if(dx < tol && dy < tol){ lockPiece(p); return true; }
    return false;
  }

  function onSolved(){
    solved = true;
    stopTimer();
    deselect();
    winText.textContent = "Solved in " + fmt(elapsed) + " · " + moves + " moves";
    winBar.classList.add("on");
  }

  /* ---------------- selection (tap to place) ---------------- */
  function deselect(){
    if(selected){ selected.el.classList.remove("selected"); selected = null; }
  }
  function select(p){
    deselect();
    selected = p;
    p.el.classList.add("selected");
  }

  board.addEventListener("pointerdown", function(e){
    if(!selected || solved) return;
    if(e.target.closest(".piece")) return; // dragging handles it
    var rect = board.getBoundingClientRect();
    var fx = (e.clientX - rect.left) / rect.width - 0.5 / cols;
    var fy = (e.clientY - rect.top) / rect.height - 0.5 / rows;
    startTimer();
    var p = selected;
    if(!trySnap(p, fx, fy)) placeLoose(p, fx, fy);
    deselect();
  });

  /* ---------------- dragging (Pointer Events: mouse + touch) ---------------- */
  function attachDrag(p){
    var el = p.el;
    var drag = null;

    el.addEventListener("pointerdown", function(e){
      if(p.state === "locked" || solved) return;
      e.preventDefault();
      drag = {
        id: e.pointerId,
        grabFX: 0, grabFY: 0,
        startX: e.clientX, startY: e.clientY,
        moved: false, lifted: false,
        fromTray: p.state === "tray",
        prevState: p.state, prevLx: p.lx, prevLy: p.ly
      };
      var rect = el.getBoundingClientRect();
      drag.grabFX = (e.clientX - rect.left) / rect.width;
      drag.grabFY = (e.clientY - rect.top) / rect.height;
      drag.grabDX = e.clientX - rect.left;
      drag.grabDY = e.clientY - rect.top;
      el.classList.add("dragging");
      el.setPointerCapture(e.pointerId);
      startTimer();
    });

    el.addEventListener("pointermove", function(e){
      if(!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
      if(Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
      if(!drag.moved) return;
      if(drag.fromTray && !drag.lifted){
        // lift only once the pointer actually moves: a tap never leaves the tray
        var brect0 = board.getBoundingClientRect();
        p.lx = (e.clientX - brect0.left) / brect0.width - 0.5 / cols;
        p.ly = (e.clientY - brect0.top) / brect0.height - 0.5 / rows;
        p.state = "loose";
        looseLayer.appendChild(el);
        renderPiece(p);
        positionPiece(p);
        var nr = el.getBoundingClientRect();
        drag.grabDX = nr.width / 2;
        drag.grabDY = nr.height / 2;
        drag.lifted = true;
      }
      if(p.state !== "loose") return;
      var brect = board.getBoundingClientRect();
      var m = margin();
      var lift = e.pointerType === "touch" ? cellH() * 0.55 : 0;
      var left = e.clientX - brect.left - drag.grabDX;
      var top  = e.clientY - brect.top - drag.grabDY - lift;
      el.style.left = left + "px";
      el.style.top  = top + "px";
      drag.cellX = (left + m) / brect.width;
      drag.cellY = (top + m) / brect.height;
    });

    function restorePrev(){
      if(drag.prevState === "tray"){ p.state = "tray"; tray.appendChild(p.el); }
      else { p.state = "loose"; p.lx = drag.prevLx; p.ly = drag.prevLy; looseLayer.appendChild(p.el); positionPiece(p); }
    }
    function finish(e, cancelled){
      if(!drag || e.pointerId !== drag.id) return;
      var d = drag; drag = null;
      el.classList.remove("dragging");
      if(cancelled){ if(d.lifted) restorePrev(); return; }
      if(!d.moved){
        // a tap: select in place, never move the piece
        if(selected === p) deselect(); else select(p);
        return;
      }
      if(!d.lifted){ restorePrev(); return; }
      deselect();
      var brect = board.getBoundingClientRect();
      // dropped outside the board in screen space: back to the tray, never lost
      if(e.clientX < brect.left - 8 || e.clientX > brect.right + 8 ||
         e.clientY < brect.top - 8 || e.clientY > brect.bottom + 8){ sendToTray(p); return; }
      var m = margin();
      var lift = e.pointerType === "touch" ? cellH() * 0.55 : 0;
      var fx = (e.clientX - brect.left - d.grabDX + m) / brect.width;
      var fy = (e.clientY - brect.top - d.grabDY - lift + m) / brect.height;
      if(!trySnap(p, fx, fy)) placeLoose(p, fx, fy);
    }
    el.addEventListener("pointerup", function(e){ finish(e, false); });
    el.addEventListener("pointercancel", function(e){ finish(e, true); });
  }

  /* ---------------- controls ---------------- */
  document.getElementById("newBtn").addEventListener("click", newGame);
  document.getElementById("againBtn").addEventListener("click", newGame);

  var ghostBtn = document.getElementById("ghostBtn");
  ghostBtn.addEventListener("click", function(){
    var on = board.classList.toggle("ghost-on");
    ghostBtn.setAttribute("aria-pressed", on ? "true" : "false");
  });

  var peekBtn = document.getElementById("peekBtn");
  function peekOn(e){ e.preventDefault(); board.classList.add("peeking"); }
  function peekOff(){ board.classList.remove("peeking"); }
  peekBtn.addEventListener("pointerdown", peekOn);
  peekBtn.addEventListener("pointerup", peekOff);
  peekBtn.addEventListener("pointerleave", peekOff);
  peekBtn.addEventListener("pointercancel", peekOff);

  document.getElementById("hintBtn").addEventListener("click", function(){
    var open = pieces.filter(function(p){ return p.state !== "locked"; });
    if(!open.length) return;
    var p = open[Math.floor(Math.random() * open.length)];
    // flash its home cell
    var cw = cellW(), ch = cellH();
    flashEl.style.left = (p.c * cw) + "px";
    flashEl.style.top = (p.r * ch) + "px";
    flashEl.style.width = cw + "px";
    flashEl.style.height = ch + "px";
    flashEl.classList.remove("on");
    void flashEl.offsetWidth;
    flashEl.classList.add("on");
    setTimeout(function(){ flashEl.classList.remove("on"); }, 1600);
    if(p.state === "tray"){
      p.el.scrollIntoView({ block:"nearest", behavior:"smooth" });
      p.el.classList.remove("hintpulse");
      void p.el.offsetWidth;
      p.el.classList.add("hintpulse");
      setTimeout(function(){ p.el.classList.remove("hintpulse"); }, 1400);
    }
  });

  document.getElementById("sizeSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-n]");
    if(!b) return;
    this.querySelectorAll("button").forEach(function(x){ x.classList.remove("sel"); });
    b.classList.add("sel");
    targetN = parseInt(b.dataset.n, 10);
    newGame();
  });

  /* ---------------- resize ---------------- */
  var rzT = 0;
  window.addEventListener("resize", function(){
    clearTimeout(rzT);
    rzT = setTimeout(layoutAll, 120);
  });
